name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag name becomes the release name, the GitHub release, and the image tag.
# A tag with a SemVer pre-release identifier (v1.0.0-rc.1, v0.9.0-beta) is
# published as a GitHub pre-release and never moves the image's :latest tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub release

jobs:
  # Gate the release on a clean type-check and test run. If either fails,
  # nothing is published. No browser is installed here, so the browser-guarded
  # tests skip (they were flaky on shared runners); everything else runs,
  # including the DB compatibility fixtures. Run the full suite locally (or in
  # the image) before tagging. The Docker build still launches each browser
  # engine, so an image without working browsers fails to publish.
  check:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Runs record momus's version from package.json (RFC-0002), so a tag that
      # disagrees with it would stamp every run with the wrong version.
      - name: Tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Test
        run: bun run test
      # SemVer puts the pre-release identifier after a hyphen that follows the
      # version core. Matching the core, not just any hyphen, keeps a hyphen in
      # build metadata (v1.0.0+build-7) from marking a stable release.
      - name: Detect pre-release
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # A notes-only GitHub release for the changelog. momus is distributed as the
  # Docker image (see the docker job) — Chromium and its dependencies are baked
  # in, so there are no standalone binaries to attach.
  github-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}"

  # Build and push the multi-arch image in one shot: run on an arm64 runner and
  # let buildx build arm64 natively and amd64 under QEMU emulation.
  # Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
  docker:
    needs: check
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/momus
    steps:
      - uses: actions/checkout@v4

      # Register QEMU binfmt handlers so buildx can build the non-native (amd64)
      # platform via emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # {{version}} keeps the pre-release identifier (:1.0.0-rc.1). :latest
          # is for stable releases only, so `docker pull momus` never lands on
          # a release candidate.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.check.outputs.prerelease != 'true' }}

      - name: Build and push (arm64 native, amd64 emulated)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

